appId: io.westpoint.mimik
productName: Mimik
executableName: Mimik
extraMetadata:
  name: mimik
  productName: Mimik
  homepage: https://github.com/westpoint-io/mimik
npmRebuild: false
afterPack: scripts/flip-fuses.cjs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - "!out/THIRD_PARTY_NOTICES.txt"
  - package.json
  - "!**/capture-native/{target,src}{,/**}"
  - "!**/capture-native/{Cargo.*,build.rs,rustfmt.toml,*.md}"
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: ../../LICENSE
    to: LICENSE.txt
extraResources:
  - from: resources
    to: .
fileAssociations:
  - ext: mimik
    name: Mimik guide
    description: Mimik guide
    role: Editor
    mimeType: application/x-mimik
publish:
  provider: github
  owner: westpoint-io
  repo: mimik
mac:
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mimik listens while you narrate a recording, when you turn narration on.
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  executableName: mimik
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: linux/icon512.png
  target:
    - AppImage
    - deb
    - rpm
deb:
  afterInstall: linux/after-install.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libxt6
    - libxrandr2
    - libasound2
    - libdbus-1-3
    - libgbm1
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - x11-utils
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - (libXt or libXt6)
    - (libXrandr or libXrandr2)
    - (alsa-lib or libasound2)
    - (mesa-libgbm or libgbm1)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - xprop
    - xwininfo
