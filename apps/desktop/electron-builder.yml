appId: io.westpoint.mimik
productName: Mimik
executableName: mimik
extraMetadata:
  name: mimik
  productName: Mimik
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
publish:
  provider: github
  owner: westpoint-io
  repo: mimik
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  category: Utility
  target:
    - AppImage
    - deb
