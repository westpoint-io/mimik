appId: io.westpoint.mimik
productName: Mimik
executableName: Mimik
extraMetadata:
  name: mimik
  productName: Mimik
  homepage: https://github.com/westpoint-io/mimik
npmRebuild: false
beforePack: scripts/stage-addon.cjs
afterPack: scripts/flip-fuses.cjs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - "!out/THIRD_PARTY_NOTICES.txt"
  - package.json
  - "!packages/**"
  - from: staging/addon
    to: node_modules/@mimik/capture-native
    filter:
      - package.json
      - index.js
      - index.d.ts
      - "*.node"
asarUnpack:
  - "**/*.node"
extraFiles:
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: ../../LICENSE
    to: LICENSE.txt
extraResources:
  - from: resources
    to: .
fileAssociations:
  - ext: mimik
    name: Mimik guide
    description: Mimik guide
    role: Editor
    mimeType: application/x-mimik
publish:
  provider: github
  owner: westpoint-io
  repo: mimik
mac:
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mimik listens while you narrate a recording, when you turn narration on.
win:
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  executableName: mimik
  category: Utility
  synopsis: Step-by-step guides from your clicks
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: linux/icons
  target:
    - AppImage
    - deb
    - rpm
deb:
  afterInstall: linux/after-install.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libxt6
    - libxrandr2
    - libasound2
    - libdbus-1-3
    - libgbm1
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - x11-utils
    - libxkbcommon0
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - (libXt or libXt6)
    - (libXrandr or libXrandr2)
    - (alsa-lib or libasound2)
    - (mesa-libgbm or libgbm1)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - xprop
    - xwininfo
    - libxkbcommon
