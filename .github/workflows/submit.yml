name: Submit to Stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g., v1.0.0)"
        required: true
        type: string
      dryRun:
        description: Dry run (build + zip but skip submission)
        required: false
        default: false
        type: boolean
      targets:
        description: Which stores to submit to
        required: true
        default: chrome-firefox
        type: choice
        options:
          - chrome-firefox
          - chrome
          - firefox

permissions:
  contents: write

jobs:
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build and zip
        run: pnpm zip:all

      - name: Upload zips to GitHub release
        working-directory: apps/extension
        run: |
          gh release upload "$TAG" \
            .output/*-chrome.zip \
            .output/*-firefox.zip \
            .output/*-sources.zip \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

      - name: Submit to Chrome Web Store
        working-directory: apps/extension
        if: inputs.targets != 'firefox' && !inputs.dryRun
        run: |
          pnpm wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox AMO
        working-directory: apps/extension
        if: inputs.targets != 'chrome' && !inputs.dryRun
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
