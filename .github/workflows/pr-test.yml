name: PR Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Workflow audit
        run: pipx run zizmor==1.30.1 --offline .github/workflows

      - name: Spelling
        run: pipx run typos==1.51.0

      - name: Dependency audit
        run: pnpm audit --prod --audit-level critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Publish coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"]
              .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              .join("\n");
            console.log(`## Test coverage\n\n| metric | % | covered |\n| --- | --- | --- |\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build Chrome
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Build Firefox
        run: pnpm build:firefox

      - name: Firefox add-on lint
        run: pnpm dlx web-ext@8.10.0 lint --source-dir apps/extension/.output/firefox-mv3 --self-hosted=false
