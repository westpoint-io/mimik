name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      extension: ${{ steps.extension.outputs.release_created }}
      extension-tag: ${{ steps.extension.outputs.tag_name }}
      desktop: ${{ steps.desktop.outputs.release_created }}
      desktop-tag: ${{ steps.desktop.outputs.tag_name }}
    steps:
      - id: extension
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: .github/release-please/extension-config.json
          manifest-file: .github/release-please/extension-manifest.json

      - id: desktop
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: .github/release-please/desktop-config.json
          manifest-file: .github/release-please/desktop-manifest.json

  desktop-windows:
    needs: release-pr
    if: needs.release-pr.outputs.desktop == 'true'
    uses: $/.github/workflows/desktop-windows-release.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  desktop:
    name: Desktop installers
    needs: [release-pr, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mimik-windows-signed
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-pr.outputs.desktop-tag }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "Desktop ${TAG#desktop-}"

  extension:
    name: Extension packages
    needs: release-pr
    if: needs.release-pr.outputs.extension == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile

      - run: pnpm zip:all

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-pr.outputs.extension-tag }}
        run: |
          gh release upload "$TAG" \
            apps/extension/.output/*-chrome.zip \
            apps/extension/.output/*-firefox.zip \
            apps/extension/.output/*-sources.zip
          gh release edit "$TAG" --title "Extension $TAG"
          desktop=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-v" -q '.[].ref' | sed 's|^refs/tags/||' | sort -V | tail -1)
          if [ -n "$desktop" ]; then
            gh release edit "$desktop" --latest
          fi
