name: Desktop Linux release

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desktop-linux-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: sudo apt-get update && sudo apt-get install -y rpm libxkbcommon-dev

      - run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm --filter @mimik/capture-native build

      - name: Build the app
        run: pnpm build:desktop

      - name: Package the AppImage, deb and rpm
        run: pnpm --filter @mimik/desktop exec electron-builder --linux --x64 --publish never

      - name: Check the deb on Debian 12 and Ubuntu 24.04
        working-directory: apps/desktop
        run: |
          deb=$(ls dist/*.deb)
          addon=../../packages/capture-native/capture-native.linux-x64-gnu.node
          scripts/check-deb.sh "$deb" debian:12 "$addon"
          scripts/check-deb.sh "$deb" ubuntu:24.04 "$addon"

      - name: Check the update feed lists every package
        working-directory: apps/desktop
        run: |
          for ext in AppImage deb rpm; do
            grep -q "url: .*\.$ext$" dist/latest-linux.yml || { echo "latest-linux.yml has no .$ext"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mimik-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
