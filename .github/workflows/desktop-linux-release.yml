name: Desktop Linux release

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desktop-linux-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build:desktop

      - name: Package the AppImage, deb and rpm
        run: pnpm --filter @mimik/desktop exec electron-builder --linux --x64 --publish never

      - name: Check the deb on Debian 12 and Ubuntu 24.04
        working-directory: apps/desktop
        run: |
          deb=$(ls dist/*.deb)
          scripts/check-deb.sh "$deb" debian:12
          scripts/check-deb.sh "$deb" ubuntu:24.04

      - name: Check the update feed lists every package
        working-directory: apps/desktop
        run: |
          for ext in AppImage deb rpm; do
            grep -q "url: .*\.$ext$" dist/latest-linux.yml || { echo "latest-linux.yml has no .$ext"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimik-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
