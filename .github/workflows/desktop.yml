name: Desktop

on:
  pull_request:
    branches:
      - desktop
  push:
    branches:
      - desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Workflow audit
        run: pipx run zizmor==1.30.1 --offline .github/workflows

      - name: Spelling
        run: pipx run typos==1.51.0

      - name: Dependency audit
        run: pnpm audit --prod --audit-level critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Storage check
        run: xvfb-run -a pnpm --filter @mimik/desktop check:storage

      - name: Pipeline check
        run: xvfb-run -a pnpm --filter @mimik/desktop check:pipeline

      - name: Overlay check
        run: xvfb-run -a pnpm --filter @mimik/desktop check:overlay

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the accessibility addon
        run: pnpm --filter @mimik/capture-native build

      - name: Storage check
        run: pnpm --filter @mimik/desktop check:storage

      - name: Pipeline check
        run: pnpm --filter @mimik/desktop check:pipeline

      - name: Build the installer
        run: |
          pnpm build:desktop
          pnpm --filter @mimik/desktop exec electron-builder --win --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mimik-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
