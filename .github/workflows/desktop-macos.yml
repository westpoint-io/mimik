name: Desktop macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the accessibility addon
        run: pnpm --filter @mimik/capture-native build

      - name: Storage check
        run: pnpm --filter @mimik/desktop check:storage

      - name: Pipeline check
        run: pnpm --filter @mimik/desktop check:pipeline

      - name: Build the disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ARCH: ${{ matrix.arch }}
        run: |
          pnpm build:desktop
          pnpm --filter @mimik/desktop exec electron-builder --mac dmg --"$ARCH" --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mimik-macos-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
