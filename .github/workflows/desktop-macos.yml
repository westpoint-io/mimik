name: Desktop macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the accessibility addon
        run: pnpm --filter @mimik/capture-native build

      - name: Storage check
        run: pnpm --filter @mimik/desktop check:storage

      - name: Pipeline check
        run: pnpm --filter @mimik/desktop check:pipeline

      - name: Build the disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ARCH: ${{ matrix.arch }}
        run: |
          pnpm build:desktop
          pnpm --filter @mimik/desktop exec electron-builder --mac dmg --"$ARCH" --publish never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimik-macos-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
